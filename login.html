<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Website Streaming</title>

    <!--UNTUK BAGIAN FILE CSS-->
    <link rel="stylesheet" href="login.css">

</head>

<body>

    <div class="login-container">
        <div class="login-box">

             <h1>STREAMING</h1>

             <p class="subtitle"> 
             Nikmati film dan series favoritmu
            </p>

            <div class="form-tabs">
                <button class="tab active">Login</button>
                <button class="tab hover">Register</button>
            </div>

            <h2>Selamat Datang!</h2>

            <p>Silahkan masuk ke akun kamu.</p>

            <form>

                <label for="username">Username: </label>
                <input 
                    type="text" 
                    id="username"
                    name="username" 
                    placeholder="Masukkan Username"> <br>

                <label for="password">Password: </label>
                <input 
                    type="password" 
                    id="password"
                    name="password" 
                    placeholder="Masukkan Password"> <br>

                <a href="index.html" class="submit-btn">Login</a>

            </form>

            <!-- <p id="login-message">
                Username atau Password Salah!
            </p> -->

            <p class="singup-text">
                Belum punya akun?
            </p>

            <p class="singup-link">
                <a href="register.html">Daftar sekarang!</a>
            </p>

        </div>
    </div>    

</body>
</html>
